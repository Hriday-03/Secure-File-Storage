services:
  backend:
    build: ./backend
    image: secure-file-storage-backend:latest
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite:////data/secure_storage.db
      STORAGE_PATH: /data/encrypted_files
      LOG_DIR: /data/logs
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - storage_data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build: ./frontend
    image: secure-file-storage-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  storage_data: